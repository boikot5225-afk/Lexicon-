name: Android CI
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The hosted Ubuntu runner already includes Android command-line tools.
      # setup-android@v3 tries to install obsolete SDK package "tools" and fails.
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Tests and debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: lexicon-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
